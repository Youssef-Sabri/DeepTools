services:
  postgres:
    image: postgres:16-alpine
    container_name: deeptools-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dataforge_db
    ports:
      - "5439:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: "no"

  adminer:
    image: adminer:latest
    container_name: deeptools-adminer
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    restart: "no"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: deeptools-api
    env_file:
      - ./backend/.env
    environment:
      - PORT=4000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/dataforge_db
      - UPLOAD_DIR=/app/uploads
    ports:
      - "4000:4000"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      - postgres
    restart: "no"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    container_name: deeptools-web
    env_file:
      - ./frontend/.env
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: "no"

volumes:
  pgdata:
