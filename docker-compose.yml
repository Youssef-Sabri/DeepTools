services:
  postgres:
    image: postgres:16-alpine
    container_name: deeptools-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dataforge_db
    ports:
      - "5439:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dataforge_db"]
      interval: 2s
      timeout: 5s
      retries: 10
    restart: unless-stopped


  studio:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: deeptools-studio
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/dataforge_db
    ports:
      - "5555:5555"
    command: ["npx", "prisma", "studio", "--port", "5555", "--browser", "none", "--hostname", "0.0.0.0"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: deeptools-api
    env_file:
      - ./backend/.env
    environment:
      - PORT=4000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/dataforge_db
      - UPLOAD_DIR=/app/uploads
    ports:
      - "4000:4000"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: deeptools-web
    env_file:
      - ./frontend/.env
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
