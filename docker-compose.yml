services:
  postgres:
    image: postgres:16-alpine
    container_name: deeptools-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: dataforge_db
    ports:
      - "127.0.0.1:5439:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dataforge_db"]
      interval: 2s
      timeout: 5s
      retries: 10
    restart: unless-stopped


  studio:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: deeptools-studio
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/dataforge_db
    ports:
      - "5555:5555"
    command: ["npx", "prisma", "studio", "--port", "5555", "--browser", "none", "--hostname", "0.0.0.0"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: deeptools-api
    env_file:
      - ./backend/.env
    environment:
      - PORT=4000
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/dataforge_db
      - UPLOAD_DIR=/app/uploads
      # This image is BUILT from ./backend (only ./uploads is bind-mounted), so
      # after changing backend code you MUST run:
      #   docker compose build api && docker compose up -d --force-recreate api
      #
      # POSTGRES_PASSWORD comes from the project-root .env (git-ignored) and only
      # applies when the pgdata volume is first initialised -- see
      # backend/.env.example to rotate an existing volume.
      #
      # For production override NODE_ENV/JWT_SECRET/DATABASE_URL here; env.ts
      # rejects placeholder secrets and refuses EXPOSE_ERROR_DETAILS=true.
    ports:
      - "4000:4000"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: deeptools-web
    env_file:
      - ./frontend/.env
    environment:
      - API_INTERNAL_URL=http://api:4000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
