services:
  postgres:
    image: postgres:16-alpine
    container_name: deeptools-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dataforge_db
    ports:
      - "5439:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: deeptools-api
    environment:
      - PORT=${PORT:-4000}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/dataforge_db}
      - JWT_SECRET=${JWT_SECRET:-super-secret-jwt-key-change-this-in-production}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-3600s}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-another-super-secret-refresh-key}
      - JWT_REFRESH_EXPIRATION=${JWT_REFRESH_EXPIRATION:-604800s}
    ports:
      - "4000:4000"
    depends_on:
      - postgres
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: deeptools-web
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
